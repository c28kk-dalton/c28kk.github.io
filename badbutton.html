<!DOCTYPE html>
<html>
<head>
	<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee+Spice&display=swap" rel="stylesheet">

<style>
	#badbutton{
		position: absolute;
		background-color: lightpink;
		border: 1px solid black;
		color: black;
		width: 250px;
		height: 50px;
		font-family: bungee spice;
		font-size: 20px;


	}
</style>
</head>

<body>
	<button id="badbutton">you can't click me!</button>

	<script type="text/javascript">
		console.log(window.innerWidth)
	let badbutton = document.getElementById("badbutton")
	console.log("badbutton")

	// badbutton.addEventListener("click", function(){
	// 	console.log("click")
	// })


	badbutton.addEventListener("mouseover", function(){
			console.log("mouseover")
			badbutton.style.top = Math.random()* window.innerWidth +"px"
			badbutton.style.left = Math.random()* window.innerHeight +"px"

	})
	badbutton.addEventListener("mouseout", function(){
		console.log("mouseout")
	})
	</script>


</body>
</html>
