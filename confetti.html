<!DOCTYPE html>
<html>
<head>
	<style type="text/css">
		.pieces{
			width: 20px;
			height: 20px;
			border: 1px solid black;
			display: inline-block;
			position: absolute;
			animation-name: swing;
			animation-duration: 1s;
			animation-iteration-count: infinite;
			animation-direction: alternate;
		}

		#btn{
			width: 250px;
			height: 50px;
			font-size: 20px;
			font-family: Times New Roman;
			font-style: italic;
			background-color: lightpink;
			border-color: black;

		}
		@keyframes swing {
			from {
				transform: rotate(var(--startRot));
			}
			to {
				transform: rotate(var(--endRot));
			}
		}

		@keyframes swing3d {
			from {
				transform: rotateX(-25deg) rotateY(-180deg);
			}
			to {
				transform: rotateX(25deg) rotateY(180deg);
			}
		}

	</style>
</head>
<body>
	<button id="btn">⭐️ add confetti ⭐️</button>
	<input type = "color" value = "#FF69B4" id = "colorPicker"></body>
	<script type="text/javascript">
	
	let colors = ["#EC6176", "#FFDCF7", "#FC97C9", "#F9B5AC", "hotpink", "red"]
	console.log(colors.length)

	let colorPicker = document.getElementById("colorPicker")

	function makingConfetti(){
		let confetti = document.createElement("div")
		confetti.classList.add("pieces")
		document.body.appendChild(confetti)

		let r = Math.round(Math.random()*255)
		let g = Math.round(Math.random()*255)
		let b = Math.round(Math.random()*255)
		let rotation = Math.random() * 360

		let startRot = Math.random() * -60 + "deg"
		let endRot = Math.random() * 60 + "deg"

		let randomColorIndex = Math.floor(Math.random() * colors.length)
		confetti.style.backgroundColor = colorPicker.value

				// confetti.style.backgroundColor = "rgb("+r+","+g+","+b+")"

		confetti.style.top = Math.random() * 1000 + "px"
		confetti.style.left = Math.random() * 2000 + "px"
		// confetti.style.transform = "rotate(" +rotation + "deg)"
		confetti.style.setProperty("--startRot", startRot)
		confetti.style.setProperty("--endRot", endRot)

		function fall(){
			let fallFactor = 10
			confetti.style.top = parseInt(confetti.style.top) + fallFactor + "px"

		if (parseInt(confetti.style.top) > 1000){
			confetti.style.top = Math.random()*200 + "px"
		}
		}
	setInterval(fall, 30)
	}
	
	let addConfettiBtn = document.getElementById("btn")
	addConfettiBtn.addEventListener("click", function(){
		for(let i = 0; i <200; i++){
		makingConfetti()
	}
	})

		console.log(colorPicker.value)

	// setInterval(makingConfetti, 100)
	</script>
</body>
</html>
