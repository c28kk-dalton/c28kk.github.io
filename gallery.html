<!DOCTYPE html>
<html>
<head>
	<style>
		.container{
			width: 70%;
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			margin-left: auto;
			margin-right: auto;
		}


		.item img {
			border: 1px solid black;
			width: 100%;
		}

		@media (max-width: 800px) {
			.container{
				grid-template-columns: repeat(2, 1fr);
			}
		}
	</style>
</head>
<body>
	<center>
	<div class="container">
		<div class="item">⭐️ New York City ⭐️<img src="NewYork.png"></div>
		<div class="item">⭐️ Nashville ⭐️<img src="Nashville.png"></div>
		<div class="item">⭐️ Dallas ⭐️<img src="Dallas.png"></div>
		<div class="item">⭐️ San Francisco ⭐️<img src="SanFrancisco.png"></div>
		<div class="item">⭐️ Los Angeles ⭐️<img src="LosAngeles.png"></div>
		<div class="item">⭐️ Chicago ⭐️<img src="Chicago.jpg"></div>
	</div>

</body>
</html>
