<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>document</title>
	 <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
</head>
<body>
	<script>
		function setup (){
			createCanvas(400,400);
			noStroke()
		}

		function draw(){
			background("#FF69B4");
			fill(150,0,170)
			stroke(0)
			strokeWeight(3)
			ellipse(50,50,80,80)
			fill(0,150,170)
			ellipse(145,50,80,80)
			fill(150,300,0)
			ellipse(240,50,80,80)
			fill(250,0,230)
			ellipse(330,50,80,80)
			stroke(255)
			fill(0,0,170)
			rect(10,150,100,50)
			fill(250,0,20)
			rect(280,150,100,50)
			fill(255,182,193)
			rect(145,150,100,50)
			fill(255)
			ellipse(200, 300, 140, 130)
			noStroke()
			fill(0)
			ellipse(170, 290, 40,40)
			ellipse(230, 290, 40,40)
			rect(197, 300, 5, 40)
			ellipse(200, 300, 20, 20)
			rect(190, 340, 18, 5)
			fill(255)
			ellipse(170, 290, 10,10)
			ellipse(230, 290, 10,10)
			fill(0)
			ellipse(150, 240, 40,40)
			ellipse(250, 240, 40,40)



		}

	</script>

</body>
</html>
