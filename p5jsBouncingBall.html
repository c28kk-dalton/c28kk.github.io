<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>document</title>
	 <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
</head>
<body>
	<script>
		let xpos 
		let ypos
		let xspeed
		let yspeed
		let fillColor
		let d

		function setup(){
			createCanvas(800,800)
			xpos = width/2
			ypos = height/2
			xspeed = 5
			yspeed = 8
			fillColor = 255
			d = 50
		}

//OR : ||
//AND: &&

		function draw(){
			background("lightpink")

			//running the functions:
				let randomSize = changeD(10,100)
				changeBallColor("magenta", "red", "navy", "purple")
				bounce()

			//circle speed
				xpos += xspeed
				ypos += yspeed

			//circle fill and size
				fill(fillColor)
				circle(xpos, ypos, randomSize)
				}


			function bounce(){
				//reverse direction for x 
			if (xpos + d/2 > width || xpos - d/2 < 0){
				xspeed *= -1
			}

			//reverse direction for y
			if (ypos + d/2 > height || ypos - d/2 < 0){
				yspeed *= -1
			}
			}

			function changeBallColor(bottomRightColor, topRightColor, topLeftColor, bottomLeftColor){
			//if xpos is larger than width/2 and ypos is less than height/2
				if (xpos + d/2 > width/2 && ypos -d/2 < height/2){
					fillColor = bottomRightColor
				} else if (xpos + d/2 > width/2 && ypos -d/2 > height/2){
					fillColor = topRightColor
				} else if (xpos + d/2 < width/2 && ypos -d/2 < height/2){
					fillColor = topLeftColor
				} else if (xpos + d/2 < width/2 && ypos -d/2 > height/2){
					fillColor = bottomLeftColor
				}	
			}

			function changeD(minSize, maxSize){
				let randomSize = random (minSize,maxSize)
				return randomSize
			}

	</script>

</body>
</html>
