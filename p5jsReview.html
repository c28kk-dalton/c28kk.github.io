<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>document</title>
	 <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
</head>
<body>
	<script>
		function star(x, y, radius1, radius2, npoints) {
		  let angle = TWO_PI / npoints;
		  let halfAngle = angle / 2.0;
		  beginShape();
		  for (let a = 0; a < TWO_PI; a += angle) {
		    let sx = x + cos(a) * radius2;
		    let sy = y + sin(a) * radius2;
		    vertex(sx, sy);
		    sx = x + cos(a + halfAngle) * radius1;
		    sy = y + sin(a + halfAngle) * radius1;
		    vertex(sx, sy);
		  }
		  endShape(CLOSE);
		}

		function setup (){
			createCanvas(400,400);
		}
		function draw(){
		background(255)
		for(let i = 0; i < 500; i+=100) {
			
			stroke(0)
			strokeWeight(7)
			//circle
			fill("hotpink")
			circle(0, i, 100)
			fill("purple")
			circle(100, i, 100)
			fill("hotpink")
			circle(200, i, 100)
			fill("purple")
			circle(300, i, 100)
			fill("hotpink")
			circle(400, i, 100)
			
			
			//star
			if(random() < 0.5){
				fill("hotpink")
			}
			else{
				strokeWeight(3)
			}


			fill("yellow")
			strokeWeight(1)
			star(100, i, 6,20,5)
			
			fill("purple")
			strokeWeight(1)
			star(0, i, 6,20,5)
			

			fill("purple")
			strokeWeight(1)
			star(200, i, 6,20,5)

			fill("hotpink")
			strokeWeight(1)
			star(300, i, 6,20,5)
			
			fill("purple")
			strokeWeight(1)
			star(400, i, 6,20,5)

		}
}

	</script>

</body>
</html>
