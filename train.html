<!DOCTYPE html>
<html>
<head>
	<style>
		#train{
			display: flex;
			gap: 12px;

		}

		.cart{
			border: 1px solid black;
			min-width: 100px;
			min-height: 80px;
			text-align: center;
			position: relative;
		}

		.cart:before{
			content: "";
			width: 30px;
			height: 30px;
			border: 1px solid black;
			display: block;
			border-radius: 50%;
			position: absolute;
			left: 10px;
			bottom: -15px;
		}

		.cart:after{
			content: "";
			width: 30px;
			height: 30px;
			border: 1px solid black;
			display: block;
			border-radius: 50%;
			position: absolute;
			left: 60px;
			bottom: -15px;
		}
	</style>
</head>
<body>
	<button id = "add-person">add person</button>
	<button id = "remove-person">remove person</button>
	<input type = "text" id ="person">
	<input type = "color" value = "#ff0000" id = "colorPicker">
	<div id = "train">
		<!-- <div class ="cart">kate</div>
		<div class ="cart">parker</div>
		<div class ="cart">sophie</div> -->
	</div>

			
			<!-- JAVASCRIPT: -->
	<script type="text/javascript">
		let people = [{name: "kate", favorite_color: "#CEA2AC"}, {name: "alexandra", favorite_color: "#A675A1"}, {name: "sophie", favorite_color: "#EFD9CE"}]

		// let kate = {
		// 	name: "kate",
		// 	studentId: "c28kk",
		// 	lucky_number: 19,
		// 	favorite_color: "pink",
		// 	favorite_food: "pizza",
		// }

		let train = document.getElementById("train")
		let colorPicker = document.getElementById("colorPicker")
		

	function makeTrain(){
		train.innerHTML = ""
		for(let i = 0; i < people.length; i++){
		console.log(people[i])
		let cart = document.createElement("div")
		cart.style.backgroundColor = people[i].favorite_color
		cart.classList.add("cart")
		cart.textContent = people[i].name 
		train.appendChild(cart)
	}
		}

		makeTrain()

		let lastPerson = people.pop()
		console.log(lastPerson)
		console.log(people)

			// ADD PERSON BUTTON
		let addPersonBtn = document.getElementById("add-person")
		addPersonBtn.addEventListener("click", function(){
			let personInput = document.getElementById("person")
			console.log(colorPicker.value)
			people.push({
				name: personInput.value,
				favorite_color: colorPicker.value,
			})
				makeTrain()
			personInput.value = ""
			console.log(people)

		})
			// REMOVE PERSON BUTTON
		let removePersonBtn = document.getElementById("remove-person")
		removePersonBtn.addEventListener("click", function(){
			let personInput = document.getElementById("person")
			people.pop(personInput.value)
			makeTrain()
			personInput.value = ""
			console.log(people)
		})

	</script>


</body>
</html>
